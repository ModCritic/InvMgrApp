# Every origin of code or data that ships in InvMgr, with its license, where that license was
# read, and what the license asks of whoever distributes it.
#
# tools/licenses/check.py breaks each shipped file into leaves and proves where every leaf came
# from by matching its bytes against the inputs listed here. A leaf no origin claims fails the
# check. So does an obligation that is not met, unless the obligation records a gap with the
# decision behind it.
#
# FIELDS
#
#   id, name, version, url       what it is
#   license                      an SPDX expression (https://spdx.org/licenses/)
#   evidence                     where the license was read, never from memory or a summary
#   targets                      which shipped things it can appear in: jar, apk, repo
#   inputs                       where its bytes come from (see inputs.py for the forms)
#   files                        optional: only leaves whose name matches one of these patterns.
#                                An origin with `files` and `inside` takes those leaves from
#                                the origin it is inside, because its author differs from the
#                                package it arrived in
#   inside                       the origin whose input carries this one's files
#
#   [[origin.component]]         third-party code built into one of this origin's files
#                                (a library compiled into a native library, say), with its own
#                                license and obligations; `in` says which leaves carry it
#
#   [[origin.obligation]]        kind: source, license-text, notice or credit
#                                why: the license's own words for it, with section
#                                met_by: what satisfies it, checked on every run
#                                gap: when it is not fully met, the decision that accepted that,
#                                with who and when; printed on every run
#
# met_by forms:
#   artifact:<path>[~<text>]               the shipped file contains this path, and that file the text
#                                          (on a phone, the files native-image copied into the library count)
#   release:<file>!<member>=<sha256>       the release folder's <file> holds <member> with that hash
#   repo:<path>~<text>                     the published file contains the text, word for word
#   release-text~<text>                    the Release's own text contains it
#
# Placeholders in paths: {classes} our compiled classes, {repo} the source at the release commit,
# {build} that build's target folder, {m2} the local Maven repository, {gluon} Gluon's download
# folder, {graalvm} the GraalVM used, {release} the release folder, {version} its version.

schema = 1

# ---------------------------------------------------------------------------------------------
# Our own

[[origin]]
id = "invmgr"
name = "InvMgr itself"
license = "0BSD"
evidence = ["repo:LICENSE"]
targets = ["jar", "apk", "repo"]
inputs = [
  "dir:{classes}", "file:{repo}/pom.xml",
  "src:{repo}/src/android/java", "file:{repo}/src/android/AndroidManifest.xml",
]
# The Android app's own C, compiled by the build from native/*.c, and its Java, which
# native-image compiles from the build's classes folder.
native_inputs = ["{build}/gluonfx/aarch64-android/gvm/InvMgr/invmgr_*.o"]
image_classpath = ["{build}/classes"]
linked_libraries = ["libsubstrate.so"]
# The published repository. The golden harness in tools/golden holds code taken from the HTML
# version of InvMgr, which is our own work too.
repo_paths = [
  "src/main/java/**", "src/test/**", "src/android/java/**", "src/android/AndroidManifest.xml",
  "src/main/resources/com/modcritic/invmgr/app.properties", "src/main/resources/com/modcritic/invmgr/ui/canvas.css",
  "src/main/resources/com/modcritic/invmgr/ui/licenses/*.txt",
  "native/**", "tools/**", "site/**", "assets/icons/btn-*.svg",
  "pom.xml", "README.md", "LICENSE", "NOTICE.md", ".gitignore",
]
# License and copyright lines that belong in files we claim as our own, each with its reason.
repo_markers = [
  { path = "LICENSE", why = "the 0BSD license text itself" },
  { path = "NOTICE.md", why = "the third-party notices file" },
  { path = "README.md", why = "its License section" },
  { path = "src/main/java/com/modcritic/invmgr/ui/AppInfo.java", why = "the credits the About screen showed until 2026-10-31" },
  { path = "src/main/java/com/modcritic/invmgr/ui/LicenseNotices.java", why = "names what licenses ask for: a copy of the license, a copyright notice" },
  { path = "src/test/java/com/modcritic/invmgr/ui/LicenseNoticesTest.java", why = "checks a notice's copyright line survives on the Licenses page" },
  { path = "src/test/java/com/modcritic/invmgr/ui/MenuWindowAppTest.java", why = "checks the Licenses page shows the GPL's own first line" },
  { path = "src/main/resources/com/modcritic/invmgr/ui/licenses/*.txt", why = "the Licenses page's index: the credits and license names the app shows, written by notices.py" },
  { path = "tools/licenses/*", why = "the license check, which names licenses" },
]

