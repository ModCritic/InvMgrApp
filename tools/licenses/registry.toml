[[origin]]
id = "invmgr"
name = "InvMgr itself"
license = "0BSD"
evidence = ["repo:LICENSE"]
targets = ["jar", "apk", "linux", "windows", "repo"]
inputs = [
  "dir:{classes}", "file:{repo}/pom.xml", "file:{repo}/LICENSE",
  "src:{repo}/src/android/java", "file:{repo}/src/android/AndroidManifest.xml",
]
# Our compiled classes hold copies of the runtime's legal files for the Licenses page, so the
# runtime's own copies in a Linux download would otherwise match here too.
not_files = ["*lib/runtime/*", "*InvMgr/runtime/*"]
# The Android app's own C, compiled by the build from native/*.c, and its Java, which
# native-image compiles from the build's classes folder.
native_inputs = ["{build}/gluonfx/aarch64-android/gvm/InvMgr/invmgr_*.o"]
image_classpath = ["{build}/classes"]
linked_libraries = ["libsubstrate.so"]
# The published repository. The golden harness in tools/golden holds code taken from the HTML
# version of InvMgr, which is our own work too.
repo_paths = [
  "src/main/java/**", "src/test/**", "src/android/java/**", "src/android/AndroidManifest.xml",
  "src/main/resources/com/modcritic/invmgr/app.properties", "src/main/resources/com/modcritic/invmgr/ui/canvas.css",
  "src/main/resources/com/modcritic/invmgr/ui/licenses/*.txt",
  "native/**", "tools/**", "site/**", "assets/icons/btn-*.svg",
  "pom.xml", "README.md", "LICENSE", "NOTICE.md", ".gitignore",
]
# License and copyright lines that belong in files we claim as our own, each with its reason.
repo_markers = [
  { path = "LICENSE", why = "the 0BSD license text itself" },
  { path = "NOTICE.md", why = "the third-party notices file" },
  { path = "README.md", why = "its License section" },
  { path = "src/main/java/com/modcritic/invmgr/ui/AppInfo.java", why = "the credits the About screen showed until 2026-10-31" },
  { path = "src/main/java/com/modcritic/invmgr/ui/LicenseNotices.java", why = "names what licenses ask for: a copy of the license, a copyright notice" },
  { path = "src/test/java/com/modcritic/invmgr/ui/LicenseNoticesTest.java", why = "checks a notice's copyright line survives on the Licenses page" },
  { path = "src/test/java/com/modcritic/invmgr/ui/MenuWindowAppTest.java", why = "checks the Licenses page shows the GPL's own first line" },
  { path = "src/main/resources/com/modcritic/invmgr/ui/licenses/*.txt", why = "the Licenses page's index: the credits and license names the app shows, written by notices.py" },
  { path = "tools/licenses/*", why = "the license check, which names licenses" },
  { path = "tools/installers/build-linux.sh", why = "writes the AppImage's licenses/README.txt, which names the runtime's licenses, and copies the license files" },
]

